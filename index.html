<!DOCTYPE html>
<html>
<head>
<title>Idle Money Clicker</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="money">
    <span id="moneyLabel">Money:</span>
    <span id="moneyValue">$0</span>
</div>


<div id="stats">

    <button id="backpack">
        🎒
    </button>

    <div id="income">
        +$0 / sec
    </div>

</div>
    
<!-- Auto Clicker Button -->

<button id="autoClickerButton" aria-label="Auto Clicker">
    <span class="pixelCursor"></span>
</button>


<!-- Auto Clicker Panel -->

<div id="autoClickerPanel">

    <h3>Auto Clicker</h3>

    <p id="autoClickerStatus">
        No target selected.
    </p>

    <button id="selectAutoTarget">
        Select Location
    </button>

    <button id="stopAutoClicker">
        Stop
    </button>

    <div id="autoClickerSpeedControls">

        <p>Speed</p>

        <input
            type="number"
            id="autoSpeedInput"
            min="1"
            max="100"
            step="1"
            value="10"
        >

        <span>clicks/sec</span>

    </div>

</div>
    
<div id="inventory"></div>



<div id="dollar">
    $
</div>




<div id="menu">

 <div id="tabs">

<button class="tab">Tab 1</button>
<button class="tab">Tab 2</button>
<button class="tab" id="shopTab">Shop</button>
<button class="tab">Tab 4</button>
<button class="tab" id="settingsTab">Settings</button>

</div>



    <div id="content">


        <div id="shop">

            STORE

            <br>

            <button id="printer">

                🖨️ Printer - $50 (+$1/sec)

            </button>

        </div>


    </div>

</div>

<div id="settings">

<h2>⚙️ SETTINGS</h2>

<div id="autoSaveSetting">
    <span id="autoSaveLabel">AUTO SAVE</span>

    <span id="autoSaveOffLabel">OFF</span>

    <button id="autoSaveButton" aria-label="Toggle Auto Save">
        <span id="autoSaveKnob"></span>
    </button>

    <span id="autoSaveOnLabel">ON</span>
</div>
    
<button id="saveButton">
    💾 Save Game
</button>

<div id="saveMessage">

    <div id="saveMessageText">
        <span class="pixelCheck"></span>
        GAME SAVED
    </div>

    <div id="saveProgress"></div>

</div>

<br><br>

<button id="deleteButton">
Delete All Progress
</button>

</div>

<div id="offlinePopup">

    <div id="offlineBox">

    <button id="closeOffline">✕</button>

        <h2>Welcome Back!</h2>

        <p id="offlineText"></p>

    </div>

</div>


<div id="deletePopup">

<div id="offlineBox">

<h2>Are you sure?</h2>

<p>
Would you like to delete all your progress?
</p>

<div id="deleteButtons">

    <button id="cancelDelete">
        Cancel
    </button>

    <button id="confirmDelete">
        Delete
    </button>

</div>

</div>

</div>
    
<script>

const shopTab = document.getElementById("shopTab");
const settingsTab = document.getElementById("settingsTab");

const shop = document.getElementById("shop");
const settings = document.getElementById("settings");

function openShop() {
    shop.style.display = "block";
    settings.style.display = "none";
}

function openSettings() {
    shop.style.display = "none";
    settings.style.display = "block";
}

shopTab.onclick = openShop;
settingsTab.onclick = openSettings;

openShop();

let money = 0;

const items = {

    printer: {
        owned: 0,
        price: 50,
        income: 1
    }

};

const moneyValue = document.getElementById("moneyValue");
const incomeDisplay = document.getElementById("income");

function calculateIncome() {

    let totalIncome = 0;

    for (const item in items) {

        totalIncome +=
            items[item].owned *
            items[item].income;

    }

    return totalIncome;

}

function formatMoney(num) {

    num = Math.floor(num);

    if (num < 10000) {
        return num.toLocaleString();
    }

    const units = [
        "K", "M", "B", "T",
        "Qa", "Qi", "Sx", "Sp",
        "Oc", "No", "Dc"
    ];

    let unit = -1;

    while (num >= 1000 && unit < units.length - 1) {
        num /= 1000;
        unit++;
    }

    return num.toFixed(1).replace(".0", "") + units[unit];

}

function updateInventory() {

    const printerCount =
        document.getElementById("printerCount");

    printerCount.textContent =
        items.printer.owned;

}

function updateDisplay() {

    moneyValue.textContent =
        "$" + formatMoney(money);

    let digits =
        Math.floor(money).toString().length;

    if (digits < 7) {
        moneyValue.style.fontSize = "48px";
    } else if (digits < 10) {
        moneyValue.style.fontSize = "40px";
    } else if (digits < 13) {
        moneyValue.style.fontSize = "32px";
    } else {
        moneyValue.style.fontSize = "26px";
    }

    incomeDisplay.textContent =
        "+$" + formatMoney(calculateIncome()) + "/s";

    updateInventory();

}

function saveGame() {

    localStorage.setItem("money", money);

    localStorage.setItem(
        "printerOwned",
        items.printer.owned
    );

    localStorage.setItem(
        "lastTime",
        Date.now()
    );

}

function loadGame() {

    money =
        Number(localStorage.getItem("money")) || 0;

    items.printer.owned =
        Number(localStorage.getItem("printerOwned")) || 0;

    let lastTime =
        Number(localStorage.getItem("lastTime"));

    if (lastTime) {

        let secondsAway =
            Math.floor(
                (Date.now() - lastTime) / 1000
            );

        let earned =
            secondsAway * calculateIncome();

        if (earned > 0) {

            money += earned;

            showOfflinePopup(earned);

        }

    }

    updateDisplay();

    if (typeof updateShop === "function") {
        updateShop();
    }

}

document.addEventListener(
    "visibilitychange",
    function () {

        if (
            document.visibilityState === "visible"
        ) {

            let lastTime =
                Number(
                    localStorage.getItem("lastTime")
                );

            if (lastTime) {

                let secondsAway =
                    Math.floor(
                        (Date.now() - lastTime) / 1000
                    );

                let earned =
                    secondsAway * calculateIncome();

                if (earned > 0) {

                    money += earned;

                    updateDisplay();

                    showOfflinePopup(earned);

                }

            }

        }

    }
);

document.getElementById("dollar").onclick =
    function () {

        money++;

        updateDisplay();

    };

setInterval(function(){

    money += calculateIncome();

    updateDisplay();

},1000);

const saveButton =
    document.getElementById("saveButton");

saveButton.onclick = function () {

    saveGame();

    const saveMessage =
        document.getElementById("saveMessage");

    const saveProgress =
        document.getElementById("saveProgress");

    saveMessage.classList.add("show");

    saveProgress.style.transition = "none";
    saveProgress.style.transform = "scaleX(1)";

    void saveProgress.offsetWidth;

    saveProgress.style.transition =
        "transform 2s linear";

    saveProgress.style.transform =
        "scaleX(0)";

    setTimeout(function () {

        saveMessage.classList.remove("show");

    }, 2000);

};

const deleteButton =
    document.getElementById("deleteButton");

const deletePopup =
    document.getElementById("deletePopup");

const cancelDelete =
    document.getElementById("cancelDelete");

const confirmDelete =
    document.getElementById("confirmDelete");

deleteButton.onclick = function () {

    deletePopup.style.display = "flex";

};

cancelDelete.onclick = function () {

    deletePopup.style.display = "none";

};

confirmDelete.onclick = function () {

    localStorage.clear();

    location.reload();

};

function showOfflinePopup(amount) {

    const popup =
        document.getElementById("offlinePopup");

    const text =
        document.getElementById("offlineText");

    const close =
        document.getElementById("closeOffline");

    text.textContent =
        "While you were away, you earned $" +
        formatMoney(amount);

    popup.style.display = "flex";

    close.onclick = function () {

        popup.style.display = "none";

    };

}

const autoSaveButton =
    document.getElementById("autoSaveButton");

autoSaveButton.onclick = function(){

    if (autoSaveButton.classList.contains("on")) {

        autoSaveButton.classList.remove("on");

    } else {

        autoSaveButton.classList.add("on");

    }

};
    
</script>



<script src="shop.js"></script>

<script src="inventory.js"></script>

<script src="settings.js"></script>

<script src="autoClicker.js"></script>


</body>
</html>
